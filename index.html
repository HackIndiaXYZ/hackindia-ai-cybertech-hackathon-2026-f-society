<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLens AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (window.location.protocol !== "file:") return;

        const redirectUrl = "http://localhost:3000/";
        const fallbackMessage = document.createElement("div");
        fallbackMessage.style.cssText =
          "font-family: sans-serif; max-width: 560px; margin: 3rem auto; padding: 1.5rem; line-height: 1.6;";
        fallbackMessage.innerHTML = `
          <h1 style="margin-bottom: 0.5rem;">CodeLens AI needs the local server</h1>
          <p>This project runs as a Vite app, so opening the file directly will not load the React UI.</p>
          <p>Please start it with <code>npm run dev</code> and open <a href="${redirectUrl}">${redirectUrl}</a>.</p>
          <p><button onclick="window.location.href='${redirectUrl}'">Open app</button></p>
        `;

        document.body.innerHTML = "";
        document.body.appendChild(fallbackMessage);
        window.location.replace(redirectUrl);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
